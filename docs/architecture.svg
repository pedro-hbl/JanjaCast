<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#43b581"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5865F2"/>
    </marker>
    <marker id="arrDim" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#7b8494"/>
    </marker>
    <linearGradient id="cardG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2230"/>
      <stop offset="1" stop-color="#161b26"/>
    </linearGradient>
    <linearGradient id="goG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00ADD8"/>
      <stop offset="1" stop-color="#0b7fa3"/>
    </linearGradient>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1280" height="720" rx="20" fill="#0f1219"/>
  <rect x="0.5" y="0.5" width="1279" height="719" rx="20" fill="none" stroke="#232a38"/>

  <!-- title -->
  <text x="48" y="58" fill="#f2f4f8" font-size="28" font-weight="700">golive — how a stream travels</text>
  <text x="48" y="84" fill="#8b94a6" font-size="15">screen livestreaming as a Discord Activity · WebCodecs over WebSockets (Activities forbid WebRTC)</text>

  <!-- ============ SHARER: companion tab ============ -->
  <g>
    <rect x="48" y="128" width="330" height="212" rx="14" fill="url(#cardG)" stroke="#2c3444"/>
    <!-- chrome mark -->
    <g transform="translate(82,164)">
      <circle r="17" fill="#fff"/>
      <path d="M0 -17A17 17 0 0 1 14.7 8.5L5.2 3A11 11 0 0 0 0 -11z" fill="#EA4335" transform="rotate(-30)"/>
      <path d="M0 -17A17 17 0 0 1 14.7 8.5L5.2 3A11 11 0 0 0 0 -11z" fill="#FBBC05" transform="rotate(90)"/>
      <path d="M0 -17A17 17 0 0 1 14.7 8.5L5.2 3A11 11 0 0 0 0 -11z" fill="#34A853" transform="rotate(210)"/>
      <circle r="7.5" fill="#4285F4" stroke="#fff" stroke-width="2"/>
    </g>
    <text x="112" y="162" fill="#f2f4f8" font-size="18" font-weight="700">Sharer — companion tab</text>
    <text x="112" y="182" fill="#8b94a6" font-size="13">real Chrome, full permissions</text>
    <g fill="#aeb7c6" font-size="13.5">
      <text x="70" y="222">🖥  getDisplayMedia() — screen / window / tab</text>
      <text x="70" y="248">⚙  WebCodecs encode · H.264 (hw) + Opus</text>
      <text x="70" y="274">📶  adaptive bitrate · 30 / 60 fps</text>
      <text x="70" y="300">🛑  Stop here or remotely from the Activity</text>
    </g>
    <rect x="70" y="314" width="120" height="3" rx="1.5" fill="#d93a3a"/>
  </g>

  <!-- ============ DISCORD CLIENT: viewers ============ -->
  <g>
    <rect x="48" y="420" width="330" height="224" rx="14" fill="url(#cardG)" stroke="#2c3444"/>
    <!-- discord mark -->
    <g transform="translate(84,458)">
      <rect x="-19" y="-19" width="38" height="38" rx="11" fill="#5865F2"/>
      <path d="M-11 6c-1-8 1-13 4-16 2 1 3 2 4 3h6c1-1 2-2 4-3 3 3 5 8 4 16-2 2-5 3-7 4l-1.5-2.5h-5L-4 10c-2-1-5-2-7-4z" fill="#fff"/>
      <circle cx="-4.2" cy="0" r="2.1" fill="#5865F2"/>
      <circle cx="4.2" cy="0" r="2.1" fill="#5865F2"/>
    </g>
    <text x="114" y="456" fill="#f2f4f8" font-size="18" font-weight="700">Discord client</text>
    <text x="114" y="476" fill="#8b94a6" font-size="13">voice channel · every participant</text>
    <g fill="#aeb7c6" font-size="13.5">
      <text x="70" y="516">🎛  Activity iframe — SolidJS UI</text>
      <text x="70" y="542">🎞  WebCodecs decode → canvas · A/V sync</text>
      <text x="70" y="568">🔊  per-viewer volume · live fps / kbps / ms</text>
      <text x="70" y="594">⛔  CSP: no WebRTC, no display-capture</text>
    </g>
    <rect x="70" y="608" width="120" height="3" rx="1.5" fill="#5865F2"/>
  </g>

  <!-- ============ DISCORD PROXY ============ -->
  <g>
    <rect x="452" y="470" width="300" height="96" rx="14" fill="url(#cardG)" stroke="#3d4356"/>
    <g transform="translate(486,506)">
      <rect x="-16" y="-16" width="32" height="32" rx="9" fill="#5865F2"/>
      <path d="M-9 5c-1-6.5 1-10.5 3.3-13 1.6.8 2.4 1.6 3.2 2.4h5c.8-.8 1.6-1.6 3.2-2.4C8 -5.5 10 -1.5 9 5c-1.6 1.6-4 2.4-5.6 3.2l-1.2-2h-4.1l-1.2 2C-5 7.4-7.4 6.6-9 5z" fill="#fff"/>
    </g>
    <text x="512" y="502" fill="#f2f4f8" font-size="16" font-weight="700">Discord Activities proxy</text>
    <text x="512" y="524" fill="#8b94a6" font-size="12.5">&lt;app-id&gt;.discordsays.com</text>
    <text x="512" y="544" fill="#8b94a6" font-size="12.5">strict CSP · URL mapping "/" → tunnel</text>
  </g>

  <!-- ============ CLOUDFLARE TUNNEL ============ -->
  <g>
    <rect x="510" y="150" width="240" height="128" rx="14" fill="url(#cardG)" stroke="#5a4326"/>
    <!-- cloudflare cloud -->
    <g transform="translate(556,196)">
      <path d="M-26 12c-7 0-12-5-12-11 0-5 3.5-9.5 8.5-10.8C-27.5 -18 -20 -24 -11 -24c10 0 18 7 19.5 16C15 -7 20 -1.5 20 5c0 6.5-5 12-13 12z" fill="#F6821F" transform="scale(0.85)"/>
      <path d="M-20 10c-2-7 2-12 8-13 1-6 6-10 12-10 4 0 7 1.5 9.5 4-6 0-11 4-12.5 10-5 .5-8.5 4-9 9z" fill="#FBAD41" transform="scale(0.85)"/>
    </g>
    <text x="596" y="192" fill="#f2f4f8" font-size="16" font-weight="700">Cloudflare Tunnel</text>
    <text x="596" y="214" fill="#8b94a6" font-size="12.5">public HTTPS / WSS ingress</text>
    <text x="596" y="234" fill="#8b94a6" font-size="12.5">no ports opened at home</text>
    <text x="530" y="262" fill="#7b8494" font-size="12">or any TLS reverse proxy in front of :8080</text>
  </g>

  <!-- ============ SERVER (docker) ============ -->
  <g>
    <!-- docker dashed container -->
    <rect x="884" y="128" width="348" height="420" rx="18" fill="none" stroke="#1D63ED" stroke-width="2" stroke-dasharray="10 7"/>
    <rect x="906" y="112" width="104" height="30" rx="8" fill="#1D63ED"/>
    <text x="958" y="132" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">Docker</text>
    <text x="1222" y="134" fill="#5b83c9" font-size="12" text-anchor="end">FROM scratch · one image</text>

    <rect x="908" y="168" width="300" height="352" rx="14" fill="url(#cardG)" stroke="#155e70"/>
    <!-- go badge -->
    <rect x="932" y="192" width="56" height="34" rx="9" fill="url(#goG)"/>
    <text x="960" y="215" fill="#fff" font-size="17" font-weight="800" text-anchor="middle">GO</text>
    <text x="1002" y="208" fill="#f2f4f8" font-size="18" font-weight="700">golive server</text>
    <text x="1002" y="228" fill="#8b94a6" font-size="13">single static binary</text>
    <g fill="#aeb7c6" font-size="13.5">
      <text x="932" y="268">🔁  WebSocket relay — 1 ingest → N viewers</text>
      <text x="932" y="296">⚡  GOP cache → instant late-join</text>
      <text x="932" y="324">🧮  keyframe-aware drop for slow viewers</text>
      <text x="932" y="352">🔐  Discord OAuth + HMAC share tokens</text>
      <text x="932" y="380">📦  client embedded via embed.FS</text>
      <text x="932" y="408">🕐  ping/pong clock sync (latency stat)</text>
    </g>
    <g font-size="12" fill="#7b8494">
      <text x="932" y="448">server egress ≈ bitrate × viewers</text>
      <text x="932" y="468">(4 Mbps × 10 viewers = 40 Mbps while live)</text>
      <text x="932" y="500" fill="#00ADD8">goroutine-per-connection · zero deps beyond ws</text>
    </g>
  </g>

  <!-- ============ FLOWS ============ -->
  <!-- sharer -> tunnel -->
  <path d="M378 214 C 440 214, 450 214, 504 214" fill="none" stroke="#43b581" stroke-width="3.5" marker-end="url(#arrG)"/>
  <text x="392" y="200" fill="#43b581" font-size="12.5" font-weight="600">WSS · media chunks</text>

  <!-- tunnel -> server -->
  <path d="M750 214 C 810 214, 820 214, 878 240" fill="none" stroke="#43b581" stroke-width="3.5" marker-end="url(#arrG)"/>
  <text x="762" y="200" fill="#43b581" font-size="12.5" font-weight="600">H.264 + Opus</text>

  <!-- server -> proxy (fan-out down-left) -->
  <path d="M908 460 C 850 470, 820 500, 758 512" fill="none" stroke="#5865F2" stroke-width="3.5" marker-end="url(#arrB)"/>
  <text x="778" y="466" fill="#5865F2" font-size="12.5" font-weight="600">fan-out × N</text>

  <!-- proxy -> discord client -->
  <path d="M452 518 C 420 518, 410 520, 384 522" fill="none" stroke="#5865F2" stroke-width="3.5" marker-end="url(#arrB)"/>

  <!-- activity -> proxy -> server: auth (dashed, up) -->
  <path d="M378 470 C 430 440, 560 320, 878 300" fill="none" stroke="#7b8494" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrDim)"/>
  <text x="500" y="352" fill="#7b8494" font-size="12">OAuth code → token exchange · authed join · /.proxy/*</text>

  <!-- share button spawns companion tab (dashed, left column) -->
  <path d="M180 420 C 172 392, 172 368, 180 340" fill="none" stroke="#7b8494" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrDim)"/>
  <text x="30" y="384" fill="#7b8494" font-size="12">“Share screen” opens</text>
  <text x="30" y="400" fill="#7b8494" font-size="12">the capture tab</text>

  <!-- latency badge -->
  <g>
    <rect x="452" y="612" width="380" height="52" rx="26" fill="#12251a" stroke="#2b5c3f"/>
    <circle cx="486" cy="638" r="9" fill="#d93a3a">
      <animate attributeName="opacity" values="1;0.35;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="506" y="644" fill="#7ee2a8" font-size="15" font-weight="700">≈ 0.3 – 0.6 s glass-to-glass · drop-to-live keeps it flat</text>
  </g>
</svg>
