    <path id="iChrome" d="M12 0C8.21 0 4.831 1.757 2.632 4.501l3.953 6.848A5.454 5.454 0 0 1 12 6.545h10.691A12 12 0 0 0 12 0zM1.931 5.47A11.943 11.943 0 0 0 0 12c0 6.012 4.42 10.991 10.189 11.864l3.953-6.847a5.45 5.45 0 0 1-6.865-2.29zm13.342 2.166a5.446 5.446 0 0 1 1.45 7.09l.002.001h-.002l-5.344 9.257c.206.01.413.016.621.016 6.627 0 12-5.373 12-12 0-1.54-.29-3.011-.818-4.364zM12 16.364a4.364 4.364 0 1 1 0-8.728 4.364 4.364 0 0 1 0 8.728Z"/>
    <path id="iGo" d="M1.811 10.231c-.047 0-.058-.023-.035-.059l.246-.315c.023-.035.081-.058.128-.058h4.172c.046 0 .058.035.035.07l-.199.303c-.023.036-.082.07-.117.07zM.047 11.306c-.047 0-.059-.023-.035-.058l.245-.316c.023-.035.082-.058.129-.058h5.328c.047 0 .07.035.058.07l-.093.28c-.012.047-.058.07-.105.07zm2.828 1.075c-.047 0-.059-.035-.035-.07l.163-.292c.023-.035.07-.07.117-.07h2.337c.047 0 .07.035.07.082l-.023.28c0 .047-.047.082-.082.082zm12.129-2.36c-.736.187-1.239.327-1.963.514-.176.046-.187.058-.34-.117-.174-.199-.303-.327-.548-.444-.737-.362-1.45-.257-2.115.175-.795.514-1.204 1.274-1.192 2.22.011.935.654 1.706 1.577 1.835.795.105 1.46-.175 1.987-.77.105-.13.198-.27.315-.434H10.47c-.245 0-.304-.152-.222-.35.152-.362.432-.97.596-1.274a.315.315 0 01.292-.187h4.253c-.023.316-.023.631-.07.947a4.983 4.983 0 01-.958 2.29c-.841 1.11-1.94 1.8-3.33 1.986-1.145.152-2.209-.07-3.143-.77-.865-.655-1.356-1.52-1.484-2.595-.152-1.274.222-2.419.993-3.424.83-1.086 1.928-1.776 3.272-2.02 1.098-.2 2.15-.07 3.096.571.62.41 1.063.97 1.356 1.648.07.105.023.164-.117.2m3.868 6.461c-1.064-.024-2.034-.328-2.852-1.029a3.665 3.665 0 01-1.262-2.255c-.21-1.32.152-2.489.947-3.529.853-1.122 1.881-1.706 3.272-1.95 1.192-.21 2.314-.095 3.33.595.923.63 1.496 1.484 1.648 2.605.198 1.578-.257 2.863-1.344 3.962-.771.783-1.718 1.273-2.805 1.495-.315.06-.63.07-.934.106zm2.78-4.72c-.011-.153-.011-.27-.034-.387-.21-1.157-1.274-1.81-2.384-1.554-1.087.245-1.788.935-2.045 2.033-.21.912.234 1.835 1.075 2.21.643.28 1.285.244 1.905-.07.923-.48 1.425-1.228 1.484-2.233z"/>
    <path id="iDocker" d="M13.983 11.078h2.119a.186.186 0 00.186-.185V9.006a.186.186 0 00-.186-.186h-2.119a.185.185 0 00-.185.185v1.888c0 .102.083.185.185.185m-2.954-5.43h2.118a.186.186 0 00.186-.186V3.574a.186.186 0 00-.186-.185h-2.118a.185.185 0 00-.185.185v1.888c0 .102.082.185.185.185m0 2.716h2.118a.187.187 0 00.186-.186V6.29a.186.186 0 00-.186-.185h-2.118a.185.185 0 00-.185.185v1.887c0 .102.082.185.185.186m-2.93 0h2.12a.186.186 0 00.184-.186V6.29a.185.185 0 00-.185-.185H8.1a.185.185 0 00-.185.185v1.887c0 .102.083.185.185.186m-2.964 0h2.119a.186.186 0 00.185-.186V6.29a.185.185 0 00-.185-.185H5.136a.186.186 0 00-.186.185v1.887c0 .102.084.185.186.186m5.893 2.715h2.118a.186.186 0 00.186-.185V9.006a.186.186 0 00-.186-.186h-2.118a.185.185 0 00-.185.185v1.888c0 .102.082.185.185.185m-2.93 0h2.12a.185.185 0 00.184-.185V9.006a.185.185 0 00-.184-.186h-2.12a.185.185 0 00-.184.185v1.888c0 .102.083.185.185.185m-2.964 0h2.119a.185.185 0 00.185-.185V9.006a.185.185 0 00-.184-.186h-2.12a.186.186 0 00-.186.186v1.887c0 .102.084.185.186.185m-2.92 0h2.12a.185.185 0 00.184-.185V9.006a.185.185 0 00-.184-.186h-2.12a.185.185 0 00-.184.185v1.888c0 .102.082.185.185.185M23.763 9.89c-.065-.051-.672-.51-1.954-.51-.338.001-.676.03-1.01.087-.248-1.7-1.653-2.53-1.716-2.566l-.344-.199-.226.327c-.284.438-.49.922-.612 1.43-.23.97-.09 1.882.403 2.661-.595.332-1.55.413-1.744.42H.751a.751.751 0 00-.75.748 11.376 11.376 0 00.692 4.062c.545 1.428 1.355 2.48 2.41 3.124 1.18.723 3.1 1.137 5.275 1.137.983.003 1.963-.086 2.93-.266a12.248 12.248 0 003.823-1.389c.98-.567 1.86-1.288 2.61-2.136 1.252-1.418 1.998-2.997 2.553-4.4h.221c1.372 0 2.215-.549 2.68-1.009.309-.293.55-.65.707-1.046l.098-.288Z"/>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1280" height="720" rx="20" fill="#0f1219"/>
  <rect x="0.5" y="0.5" width="1279" height="719" rx="20" fill="none" stroke="#232a38"/>

  <!-- title -->
  <text x="48" y="58" fill="#f2f4f8" font-size="28" font-weight="700">JanjaCast — how a stream travels</text>
  <text x="48" y="84" fill="#8b94a6" font-size="15">screen livestreaming as a Discord Activity · WebCodecs over WebSockets (Activities forbid WebRTC)</text>

  <!-- ============ SHARER: companion tab ============ -->
  <g>
    <rect x="48" y="128" width="330" height="212" rx="14" fill="url(#cardG)" stroke="#2c3444"/>
    <use href="#iChrome" transform="translate(68,146) scale(1.5)" fill="#fff"/>
    <text x="118" y="162" fill="#f2f4f8" font-size="18" font-weight="700">Sharer — companion tab</text>
    <text x="118" y="182" fill="#8b94a6" font-size="13">real Chrome, full permissions</text>
    <g fill="#aeb7c6" font-size="13.5">
      <text x="70" y="222">getDisplayMedia() — screen / window / tab</text>
      <text x="70" y="248">WebCodecs encode · H.264 (hw) + Opus</text>
      <text x="70" y="274">adaptive bitrate · 30 / 60 fps</text>
      <text x="70" y="300">Stop here — or remotely from the Activity</text>
    </g>
    <rect x="70" y="314" width="120" height="3" rx="1.5" fill="#d93a3a"/>
  </g>

  <!-- ============ DISCORD CLIENT: viewers ============ -->
  <g>
    <rect x="48" y="420" width="330" height="224" rx="14" fill="url(#cardG)" stroke="#2c3444"/>
    <rect x="66" y="438" width="40" height="40" rx="11" fill="#5865F2"/>
    <use href="#iDiscord" transform="translate(70,444) scale(1.33)" fill="#fff"/>
    <text x="118" y="456" fill="#f2f4f8" font-size="18" font-weight="700">Discord client</text>
    <text x="118" y="476" fill="#8b94a6" font-size="13">voice channel · every participant</text>
    <g fill="#aeb7c6" font-size="13.5">
      <text x="70" y="516">Activity iframe — SolidJS UI</text>
      <text x="70" y="542">WebCodecs decode → canvas · A/V sync</text>
      <text x="70" y="568">per-viewer volume · live fps / kbps / ms</text>
      <text x="70" y="594">CSP: no WebRTC, no display-capture</text>
    </g>
    <rect x="70" y="608" width="120" height="3" rx="1.5" fill="#5865F2"/>
  </g>

  <!-- ============ CLOUDFLARE TUNNEL ============ -->
  <g>
    <rect x="500" y="150" width="264" height="130" rx="14" fill="url(#cardG)" stroke="#5a4326"/>
    <use href="#iCloudflare" transform="translate(524,170) scale(1.7)" fill="#F38020"/>
    <text x="574" y="190" fill="#f2f4f8" font-size="16" font-weight="700">Cloudflare Tunnel</text>
    <text x="574" y="212" fill="#8b94a6" font-size="12.5">public HTTPS / WSS ingress</text>
    <text x="574" y="231" fill="#8b94a6" font-size="12.5">no ports opened at home</text>
    <text x="632" y="262" fill="#7b8494" font-size="12" text-anchor="middle">or any TLS reverse proxy → :8080</text>
  </g>

  <!-- ============ SERVER (docker) ============ -->
  <g>
    <rect x="884" y="128" width="348" height="440" rx="18" fill="none" stroke="#1D63ED" stroke-width="2" stroke-dasharray="10 7"/>
    <rect x="906" y="112" width="136" height="32" rx="9" fill="#1D63ED"/>
    <use href="#iDocker" transform="translate(913,117) scale(0.92)" fill="#fff"/>
    <text x="944" y="134" fill="#fff" font-size="14" font-weight="700">Docker</text>

    <rect x="908" y="168" width="300" height="352" rx="14" fill="url(#cardG)" stroke="#155e70"/>
    <use href="#iGo" transform="translate(928,190) scale(2.1)" fill="#00ADD8"/>
    <text x="994" y="208" fill="#f2f4f8" font-size="18" font-weight="700">JanjaCast server</text>
    <text x="994" y="228" fill="#8b94a6" font-size="13">single static binary</text>
    <g fill="#aeb7c6" font-size="13.5">
      <text x="932" y="268">WebSocket relay — 1 ingest → N viewers</text>
      <text x="932" y="296">GOP cache → instant late-join</text>
      <text x="932" y="324">keyframe-aware drop for slow viewers</text>
      <text x="932" y="352">Discord OAuth + HMAC share tokens</text>
      <text x="932" y="380">client embedded via embed.FS</text>
      <text x="932" y="408">ping/pong clock sync (latency stat)</text>
    </g>
    <g font-size="12" fill="#7b8494">
      <text x="932" y="448">server egress ≈ bitrate × viewers</text>
      <text x="932" y="468">(4 Mbps × 10 viewers = 40 Mbps while live)</text>
      <text x="932" y="500" fill="#00ADD8">goroutine-per-connection · zero CGO</text>
    </g>
    <text x="1058" y="552" fill="#5b83c9" font-size="12" text-anchor="middle">FROM scratch · one multi-arch image · built-in healthcheck</text>
  </g>

  <!-- ============ DISCORD PROXY ============ -->
  <g>
    <rect x="452" y="470" width="300" height="96" rx="14" fill="url(#cardG)" stroke="#3d4356"/>
    <rect x="470" y="490" width="34" height="34" rx="9" fill="#5865F2"/>
    <use href="#iDiscord" transform="translate(474,496) scale(1.08)" fill="#fff"/>
    <text x="516" y="502" fill="#f2f4f8" font-size="16" font-weight="700">Discord Activities proxy</text>
    <text x="516" y="524" fill="#8b94a6" font-size="12.5">&lt;app-id&gt;.discordsays.com</text>
    <text x="516" y="544" fill="#8b94a6" font-size="12.5">strict CSP · URL mapping "/" → tunnel</text>
  </g>

  <!-- ============ FLOWS ============ -->
  <!-- sharer -> tunnel -->
  <path d="M378 214 L 494 214" fill="none" stroke="#43b581" stroke-width="3.5" marker-end="url(#arrG)"/>
  <text x="437" y="198" fill="#43b581" font-size="12.5" font-weight="600" text-anchor="middle">WSS · media chunks</text>

  <!-- tunnel -> server -->
  <path d="M764 214 L 878 214" fill="none" stroke="#43b581" stroke-width="3.5" marker-end="url(#arrG)"/>
  <text x="822" y="198" fill="#43b581" font-size="12.5" font-weight="600" text-anchor="middle">H.264 + Opus</text>

  <!-- server -> proxy (fan-out down-left) -->
  <path d="M908 490 C 850 496, 820 506, 760 512" fill="none" stroke="#5865F2" stroke-width="3.5" marker-end="url(#arrB)"/>
  <text x="836" y="482" fill="#5865F2" font-size="12.5" font-weight="600" text-anchor="middle">fan-out × N</text>

  <!-- proxy -> discord client -->
  <path d="M452 518 L 388 521" fill="none" stroke="#5865F2" stroke-width="3.5" marker-end="url(#arrB)"/>

  <!-- activity -> proxy -> server: auth (dashed, up) -->
  <path d="M378 452 C 480 420, 640 370, 878 330" fill="none" stroke="#7b8494" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrDim)"/>
  <g text-anchor="middle">
    <text x="612" y="352" fill="#7b8494" font-size="12">OAuth code → token exchange · authed join · /.proxy/*</text>
  </g>

  <!-- share button spawns companion tab (dashed, left column) -->
  <path d="M186 420 C 178 392, 178 368, 186 340" fill="none" stroke="#7b8494" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrDim)"/>
  <text x="200" y="376" fill="#7b8494" font-size="12">“Share screen”</text>
  <text x="200" y="392" fill="#7b8494" font-size="12">opens the capture tab</text>

  <!-- latency badge -->
  <g>
    <rect x="400" y="616" width="520" height="52" rx="26" fill="#12251a" stroke="#2b5c3f"/>
    <circle cx="432" cy="642" r="9" fill="#d93a3a">
      <animate attributeName="opacity" values="1;0.35;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="672" y="648" fill="#7ee2a8" font-size="15" font-weight="700" text-anchor="middle">≈ 0.3 – 0.6 s glass-to-glass · drop-to-live keeps it flat</text>
  </g>
</svg>
