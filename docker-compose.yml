services:
  janjacast:
    # Use the published image, or `docker compose up --build` to build locally.
    image: ghcr.io/pedro-hbl/janjacast:latest
    build:
      context: .
    ports:
      - "8080:8080"
    environment:
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      # Signs the share tokens the companion capture tab and the telinha ride
      # on. The server runs without it, but then every restart invalidates
      # every open companion link. Generate: openssl rand -base64 32
      JANJACAST_TOKEN_SECRET: ${JANJACAST_TOKEN_SECRET:-}
      # Per-room egress ceiling in kbps (default 25000). On a VPS the real
      # limit is the host's bandwidth, so 0 (unlimited) is usually right.
      JANJACAST_EGRESS_BUDGET_KBPS: ${JANJACAST_EGRESS_BUDGET_KBPS:-25000}
      # Vinhetas. To enable: put the assets in ./stingers, uncomment the
      # volume below, and set this to /stingers in your .env.
      JANJACAST_STINGER_DIR: ${JANJACAST_STINGER_DIR:-}
      # JANJACAST_PUBLIC_ORIGIN: https://stream.example.com  # optional pin
    # volumes:
    #   - ./stingers:/stingers:ro
    healthcheck:
      test: ["CMD", "/janjacast", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # Optional zero-config public HTTPS via a Cloudflare quick tunnel:
  #   docker compose --profile tunnel up
  # The tunnel URL appears in this container's logs; put it in the Discord
  # portal's URL mapping. (Quick-tunnel URLs change on every restart — use a
  # named tunnel for anything long-lived.)
  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --url http://janjacast:8080
    depends_on:
      - janjacast
    profiles: [tunnel]
    restart: unless-stopped
